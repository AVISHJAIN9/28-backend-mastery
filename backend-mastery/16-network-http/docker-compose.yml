version: '3.8'

services:
  http1-http2-http3:
    build:
      context: ./01-http1-http2-http3
      dockerfile: Dockerfile
    ports:
      - "5801:5801"
    environment:
      - HTTP_PORT=5801
      - NODE_ENV=development
    working_dir: /app
    volumes:
      - ./01-http1-http2-http3:/app
    command: npm run dev

  tcp-vs-udp:
    build:
      context: ./02-tcp-vs-udp
      dockerfile: Dockerfile

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>User Login & Register - Live Demo</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    font-family: 'Segoe UI', sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 20px;
  }

  .container {
    background: white;
    border-radius: 12px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    width: 100%;
    max-width: 450px;
    padding: 40px;
  }

  h1 {
    text-align: center;
    color: #333;
    margin-bottom: 30px;
    font-size: 28px;
  }

  .form-group {
    margin-bottom: 20px;
  }

  label {
    display: block;
    margin-bottom: 8px;
    color: #555;
    font-weight: 600;
    font-size: 14px;
  }

  input {
    width: 100%;
    padding: 12px 15px;
    border: 2px solid #e0e0e0;
    border-radius: 8px;
    font-size: 14px;
    transition: all 0.3s;
  }

  input:focus {
    outline: none;
    border-color: #667eea;
    box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
  }

  .form-actions {
    display: flex;
    gap: 10px;
    margin-bottom: 20px;
  }

  button {
    flex: 1;
    padding: 12px;
    border: none;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.3s;
  }

  .btn-login {
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    color: white;
  }

  .btn-login:hover {
    transform: translateY(-2px);
    box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
  }

  .btn-register {
    background: #f0f0f0;
    color: #333;
  }

  .btn-register:hover {
    background: #e0e0e0;
  }

  .message {
    padding: 12px 15px;
    border-radius: 8px;
    margin-bottom: 20px;
    display: none;
    animation: slideIn 0.3s;
  }

  .message.success {
    background: #d4edda;
    color: #155724;
    border: 1px solid #c3e6cb;
    display: block;
  }

  .message.error {
    background: #f8d7da;
    color: #721c24;
    border: 1px solid #f5c6cb;
    display: block;
  }

  @keyframes slideIn {
    from { transform: translateY(-10px); opacity: 0; }
    to { transform: translateY(0); opacity: 1; }
  }

  .divider {
    text-align: center;
    margin: 30px 0;
    color: #999;
    font-size: 14px;
  }

  .divider::before, .divider::after {
    content: '';
    display: inline-block;
    width: 40%;
    height: 1px;
    background: #e0e0e0;
    vertical-align: middle;
  }

  .divider::before { margin-right: 10px; }
  .divider::after { margin-left: 10px; }

  .demo-users {
    background: #f9f9f9;
    padding: 15px;
    border-radius: 8px;
    margin-top: 30px;
    border-left: 4px solid #667eea;
  }

  .demo-users h3 {
    font-size: 12px;
    color: #667eea;
    text-transform: uppercase;
    margin-bottom: 10px;
    font-weight: 700;
  }

  .demo-user {
    font-size: 12px;
    color: #666;
    margin-bottom: 8px;
    font-family: 'JetBrains Mono', monospace;
  }

  .form.register {
    display: none;
  }
</style>
</head>
<body>

<div class="container">
  <h1 id="title">Login</h1>
  
  <div id="message" class="message"></div>

  <!-- Login Form -->
  <form id="loginForm" class="form login">
    <div class="form-group">
      <label>Email Address</label>
      <input type="email" id="loginEmail" placeholder="user@example.com" required>
    </div>
    <div class="form-group">
      <label>Password</label>
      <input type="password" id="loginPassword" placeholder="Enter your password" required>
    </div>
    <div class="form-actions">
      <button type="submit" class="btn-login">Sign In</button>
      <button type="button" class="btn-register" onclick="toggleForm()">Create Account</button>
    </div>
  </form>

  <!-- Register Form -->
  <form id="registerForm" class="form register">
    <div class="form-group">
      <label>Full Name</label>
      <input type="text" id="registerName" placeholder="John Doe" required>
    </div>
    <div class="form-group">
      <label>Email Address</label>
      <input type="email" id="registerEmail" placeholder="user@example.com" required>
    </div>
    <div class="form-group">
      <label>Password</label>
      <input type="password" id="registerPassword" placeholder="Create a password (min 8 chars)" required>
    </div>
    <div class="form-group">
      <label>Confirm Password</label>
      <input type="password" id="registerConfirm" placeholder="Confirm password" required>
    </div>
    <div class="form-actions">
      <button type="submit" class="btn-login">Register</button>
      <button type="button" class="btn-register" onclick="toggleForm()">Back to Login</button>
    </div>
  </form>

  <div class="demo-users">
    <h3>🧪 Demo Credentials</h3>
    <div class="demo-user">📧 user@example.com</div>
    <div class="demo-user">🔐 password123</div>
    <div class="demo-user">✨ Try registering new users!</div>
  </div>
</div>

<script>
const users = JSON.parse(localStorage.getItem('users')) || [
  { email: 'user@example.com', password: 'password123', name: 'Demo User' }
];

function showMessage(text, type) {
  const msg = document.getElementById('message');
  msg.textContent = text;
  msg.className = `message ${type}`;
  setTimeout(() => msg.className = 'message', 4000);
}

function toggleForm() {
  document.getElementById('title').textContent = 
    document.getElementById('loginForm').style.display === 'none' ? 'Login' : 'Create Account';
  document.getElementById('loginForm').style.display = 
    document.getElementById('loginForm').style.display === 'none' ? 'block' : 'none';
  document.getElementById('registerForm').style.display = 
    document.getElementById('registerForm').style.display === 'none' ? 'block' : 'none';
  document.getElementById('message').className = 'message';
}

document.getElementById('loginForm').addEventListener('submit', (e) => {
  e.preventDefault();
  const email = document.getElementById('loginEmail').value;
  const password = document.getElementById('loginPassword').value;

  const user = users.find(u => u.email === email && u.password === password);
  if (user) {
    showMessage(`✅ Login successful! Welcome back, ${user.name}!`, 'success');
    setTimeout(() => {
      document.getElementById('loginForm').reset();
    }, 2000);
  } else {
    showMessage('❌ Invalid email or password', 'error');
  }
});

document.getElementById('registerForm').addEventListener('submit', (e) => {
  e.preventDefault();
  const name = document.getElementById('registerName').value;
  const email = document.getElementById('registerEmail').value;
  const password = document.getElementById('registerPassword').value;
  const confirm = document.getElementById('registerConfirm').value;

  if (password !== confirm) {
    showMessage('❌ Passwords do not match', 'error');
    return;
  }

  if (password.length < 8) {
    showMessage('❌ Password must be at least 8 characters', 'error');
    return;
  }

  if (users.find(u => u.email === email)) {
    showMessage('❌ Email already registered', 'error');
    return;
  }

  users.push({ email, password, name });
  localStorage.setItem('users', JSON.stringify(users));
  showMessage(`✅ Account created! Welcome, ${name}!`, 'success');
  
  setTimeout(() => {
    document.getElementById('registerForm').reset();
    toggleForm();
  }, 2000);
});
</script>
</body>
</html>

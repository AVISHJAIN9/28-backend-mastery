<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>16 - Rate Limiting Middleware</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 20px;
    }
    .container {
      max-width: 1200px;
      margin: 0 auto;
      background: white;
      border-radius: 12px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      overflow: hidden;
    }
    .header {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 30px 40px;
      text-align: center;
    }
    .header h1 { font-size: 2.5em; margin-bottom: 10px; }
    .header p { font-size: 1.1em; opacity: 0.9; }
    .content {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 30px;
      padding: 40px;
    }
    .section {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }
    .section h2 {
      color: #333;
      font-size: 1.3em;
      border-bottom: 2px solid #667eea;
      padding-bottom: 10px;
    }
    label {
      display: block;
      margin-top: 15px;
      font-weight: 600;
      color: #555;
    }
    input, select, textarea {
      width: 100%;
      padding: 12px;
      margin-top: 6px;
      border: 1px solid #ddd;
      border-radius: 6px;
      font-family: monospace;
      font-size: 14px;
    }
    textarea {
      min-height: 100px;
      resize: vertical;
    }
    button {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 6px;
      font-size: 1em;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s;
    }
    button:hover { transform: translateY(-2px); }
    button:active { transform: translateY(0); }
    .response-box {
      background: #f5f5f5;
      border-left: 4px solid #667eea;
      padding: 15px;
      border-radius: 6px;
      margin-top: 10px;
      font-family: monospace;
      font-size: 13px;
      max-height: 300px;
      overflow-y: auto;
      white-space: pre-wrap;
      word-break: break-all;
    }
    .success { border-left-color: #10b981; color: #10b981; }
    .error { border-left-color: #ef4444; color: #ef4444; }
    @media (max-width: 768px) {
      .content { grid-template-columns: 1fr; }
      .header h1 { font-size: 1.8em; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>🚦 Rate Limiting Middleware</h1>
      <p>Test request rate limiting with configurable rules</p>
    </div>
    
    <div class="content">
      <div class="section">
        <h2>Request Configuration</h2>
        
        <label>Endpoint:</label>
        <select id="endpoint">
          <option value="http://localhost:4016/api/protected">GET /api/protected</option>
          <option value="http://localhost:4016/api/public">GET /api/public</option>
          <option value="http://localhost:4016/api/login">POST /api/login</option>
        </select>
        
        <label>HTTP Method:</label>
        <select id="method">
          <option value="GET">GET</option>
          <option value="POST">POST</option>
          <option value="PUT">PUT</option>
          <option value="DELETE">DELETE</option>
        </select>
        
        <label>Request Body (JSON):</label>
        <textarea id="body" placeholder='{"key": "value"}'></textarea>
        
        <label>Headers (JSON):</label>
        <textarea id="headers" placeholder='{"X-Custom-Header": "value"}'>{}</textarea>
        
        <button onclick="sendRequest()">Send Request</button>
      </div>
      
      <div class="section">
        <h2>Response</h2>
        <div id="response" class="response-box">
          Waiting for response...
        </div>
        <div id="stats" style="background: #f0f9ff; padding: 15px; border-radius: 6px; margin-top: 15px;">
          <p><strong>Requests Sent:</strong> <span id="count">0</span></p>
          <p><strong>Rate Limit Status:</strong> <span id="status">Ready</span></p>
          <p><strong>Reset Time:</strong> <span id="reset">-</span></p>
        </div>
      </div>
    </div>
  </div>

  <script>
    let requestCount = 0;

    async function sendRequest() {
      const endpoint = document.getElementById('endpoint').value;
      const method = document.getElementById('method').value;
      const body = document.getElementById('body').value;
      const headerStr = document.getElementById('headers').value;
      
      const responseDiv = document.getElementById('response');
      
      try {
        const headers = headerStr ? JSON.parse(headerStr) : {};
        headers['Content-Type'] = 'application/json';
        
        const options = {
          method,
          headers
        };
        
        if (body && method !== 'GET') {
          options.body = JSON.stringify(JSON.parse(body));
        }
        
        const response = await fetch(endpoint, options);
        const data = await response.json();
        
        requestCount++;
        document.getElementById('count').textContent = requestCount;
        
        const remaining = response.headers.get('X-RateLimit-Remaining') || 'N/A';
        const reset = response.headers.get('X-RateLimit-Reset') || 'N/A';
        const limit = response.headers.get('X-RateLimit-Limit') || 'N/A';
        
        document.getElementById('reset').textContent = reset;
        
        const isError = response.status >= 400;
        responseDiv.className = 'response-box ' + (isError ? 'error' : 'success');
        responseDiv.textContent = JSON.stringify({
          status: response.status,
          statusText: response.statusText,
          data,
          rateLimit: {
            limit,
            remaining,
            reset
          }
        }, null, 2);
        
        document.getElementById('status').textContent = response.status === 429 ? '⛔ Limited' : '✅ OK';
      } catch (error) {
        responseDiv.className = 'response-box error';
        responseDiv.textContent = 'Error: ' + error.message;
        document.getElementById('status').textContent = '❌ Error';
      }
    }
  </script>
</body>
</html>

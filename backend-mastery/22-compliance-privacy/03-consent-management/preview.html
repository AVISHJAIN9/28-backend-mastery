<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Consent Management – Preview</title>
  <style>
    body { font-family: 'Segoe UI', sans-serif; background: #f7f8fa; margin: 0; padding: 40px 16px; }
    .card { background: #fff; border-radius: 12px; max-width: 560px; margin: 0 auto; padding: 36px; box-shadow: 0 4px 24px rgba(0,0,0,.08); }
    h1 { margin-bottom: 4px; }
    .sub { color: #718096; font-size: .9rem; margin-bottom: 24px; }
    .row { display: flex; justify-content: space-between; align-items: flex-start; padding: 16px 0; border-bottom: 1px solid #e2e8f0; }
    .label { font-weight: 600; font-size: 15px; }
    .desc { color: #718096; font-size: 13px; margin-top: 2px; }
    .toggle { position: relative; display: inline-block; width: 44px; height: 24px; flex-shrink: 0; cursor: pointer; }
    .toggle input { opacity: 0; width: 0; height: 0; }
    .slider { position: absolute; inset: 0; background: #cbd5e0; border-radius: 24px; transition: .2s; }
    .slider::after { content: ''; position: absolute; left: 2px; top: 2px; width: 20px; height: 20px; background: #fff; border-radius: 50%; transition: .2s; }
    input:checked + .slider { background: #48bb78; }
    input:checked + .slider::after { transform: translateX(20px); }
    button { margin-top: 24px; padding: 10px 28px; background: #4299e1; color: #fff; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; font-size: 15px; }
    .saved { margin-left: 16px; color: #48bb78; font-weight: 600; display: none; }
  </style>
</head>
<body>
  <div class="card">
    <h1>⚙️ Privacy Preferences</h1>
    <p class="sub">Control how we use your data. You can update these at any time.</p>
    <div id="consents"></div>
    <div style="margin-top:8px">
      <button onclick="save()">Save Preferences</button>
      <span class="saved" id="saved-msg">✅ Saved!</span>
    </div>
    <p style="margin-top:20px;font-size:12px;color:#a0aec0">Your choices are recorded with a timestamp for compliance.</p>
  </div>
  <script>
    const items = [
      { key: "marketing_email", label: "Marketing Emails", desc: "Receive product updates and newsletters.", on: false },
      { key: "analytics", label: "Analytics & Tracking", desc: "Help us improve by allowing usage analytics.", on: true },
      { key: "third_party_sharing", label: "Third-Party Sharing", desc: "Share your data with trusted partners.", on: false },
      { key: "personalisation", label: "Personalisation", desc: "Customise experience based on your activity.", on: true },
      { key: "research_profiling", label: "Research & Profiling", desc: "Use your data for internal research.", on: false },
    ];
    const container = document.getElementById("consents");
    items.forEach(item => {
      container.innerHTML += `
        <div class="row">
          <div style="flex:1;padding-right:16px">
            <div class="label">${item.label}</div>
            <div class="desc">${item.desc}</div>
          </div>
          <label class="toggle"><input type="checkbox" id="${item.key}" ${item.on ? "checked" : ""}><span class="slider"></span></label>
        </div>`;
    });
    function save() {
      const msg = document.getElementById("saved-msg");
      msg.style.display = "inline";
      setTimeout(() => msg.style.display = "none", 3000);
    }
  </script>
</body>
</html>

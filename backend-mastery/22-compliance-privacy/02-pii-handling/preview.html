<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>PII Handling – Preview</title>
  <style>
    body { font-family: 'Segoe UI', sans-serif; background: #f7f8fa; margin: 0; padding: 40px 16px; color: #1a202c; }
    .card { background: #fff; border-radius: 12px; max-width: 600px; margin: 0 auto; padding: 36px; box-shadow: 0 4px 24px rgba(0,0,0,.08); }
    h1 { margin-bottom: 4px; }
    .sub { color: #718096; font-size: .9rem; margin-bottom: 24px; }
    table { width: 100%; border-collapse: collapse; }
    th { text-align: left; padding: 10px 12px; background: #f7f8fa; font-size: 13px; color: #4a5568; }
    td { padding: 10px 12px; border-bottom: 1px solid #e2e8f0; font-size: 14px; }
    .mono { font-family: monospace; color: #718096; }
    .mono.revealed { color: #1a202c; }
    button { background: none; border: 1px solid #e2e8f0; border-radius: 4px; padding: 4px 10px; cursor: pointer; font-size: 16px; }
  </style>
</head>
<body>
  <div class="card">
    <h1>🔐 PII Data Viewer</h1>
    <p class="sub">User ID: usr_001 &nbsp;|&nbsp; Click the eye icon to reveal a field.</p>
    <table>
      <thead><tr><th>Field</th><th>Value</th><th>Action</th></tr></thead>
      <tbody id="table-body"></tbody>
    </table>
    <p style="margin-top:20px;font-size:12px;color:#a0aec0">All PII is encrypted at rest. Access is logged.</p>
  </div>
  <script>
    const data = [
      { label: "Full Name", masked: "P*** S***", real: "Priya Sharma" },
      { label: "Email", masked: "p***@example.com", real: "priya.sharma@example.com" },
      { label: "Phone", masked: "+91 *****43210", real: "+91 98765 43210" },
      { label: "Aadhaar", masked: "XXXX XXXX 9012", real: "1234 5678 9012" },
      { label: "PAN", masked: "XXXXX1234F", real: "ABCDE1234F" },
      { label: "Date of Birth", masked: "**/**/****", real: "1990-05-15" },
      { label: "Address", masked: "[REDACTED]", real: "42 MG Road, Bengaluru, KA 560001" },
    ];
    const tbody = document.getElementById("table-body");
    data.forEach((row, i) => {
      let revealed = false;
      const tr = document.createElement("tr");
      tr.innerHTML = `
        <td><strong>${row.label}</strong></td>
        <td class="mono" id="val-${i}">${row.masked}</td>
        <td style="text-align:center"><button onclick="toggle(${i})">👁️</button></td>`;
      tbody.appendChild(tr);
    });
    function toggle(i) {
      const el = document.getElementById(`val-${i}`);
      const isRevealed = el.classList.contains("revealed");
      el.textContent = isRevealed ? data[i].masked : data[i].real;
      el.classList.toggle("revealed");
    }
  </script>
</body>
</html>

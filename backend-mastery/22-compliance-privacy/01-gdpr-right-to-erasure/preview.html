<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>GDPR Right to Erasure – Preview</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body { font-family: 'Segoe UI', sans-serif; background: #f7f8fa; margin: 0; padding: 40px 16px; color: #1a202c; }
    .card { background: #fff; border-radius: 12px; max-width: 560px; margin: 0 auto; padding: 36px; box-shadow: 0 4px 24px rgba(0,0,0,.08); }
    h1 { font-size: 1.5rem; margin-bottom: 4px; }
    .subtitle { color: #718096; font-size: .9rem; margin-bottom: 28px; }
    label { display: block; font-size: .85rem; font-weight: 600; color: #4a5568; margin-bottom: 14px; }
    input, textarea { width: 100%; padding: 10px 12px; border: 1.5px solid #e2e8f0; border-radius: 8px; font-size: .95rem; margin-top: 6px; outline: none; transition: border-color .2s; }
    input:focus, textarea:focus { border-color: #e53e3e; }
    textarea { resize: vertical; min-height: 100px; }
    button { margin-top: 8px; width: 100%; padding: 12px; background: #e53e3e; color: #fff; border: none; border-radius: 8px; font-size: 1rem; font-weight: 600; cursor: pointer; transition: background .2s; }
    button:hover { background: #c53030; }
    .note { margin-top: 20px; font-size: .8rem; color: #718096; border-top: 1px solid #e2e8f0; padding-top: 16px; }
    .badge { display: inline-block; background: #fff5f5; color: #c53030; border: 1px solid #feb2b2; border-radius: 20px; padding: 2px 10px; font-size: .75rem; font-weight: 700; margin-bottom: 12px; }
  </style>
</head>
<body>
  <div class="card">
    <span class="badge">GDPR Art. 17</span>
    <h1>🗑️ Right to Erasure</h1>
    <p class="subtitle">Request permanent deletion of your personal data. We will process your request within 30 days.</p>
    <form onsubmit="handleSubmit(event)">
      <label>
        User ID
        <input type="text" id="userId" placeholder="e.g. usr_123456" required />
      </label>
      <label>
        Email Address (for confirmation)
        <input type="email" id="email" placeholder="you@example.com" required />
      </label>
      <label>
        Reason for Erasure Request
        <textarea id="reason" placeholder="e.g. I withdraw my consent and no longer wish my data to be processed." required></textarea>
      </label>
      <button type="submit">Submit Erasure Request</button>
    </form>
    <p class="note">
      Your request will be acknowledged within 72 hours. Some data may be retained where required by law.
      For questions, contact <a href="mailto:dpo@example.com">dpo@example.com</a>.
    </p>
  </div>
  <script>
    function handleSubmit(e) {
      e.preventDefault();
      alert("✅ Erasure request submitted!\n\nRequest ID: REQ-" + Math.random().toString(36).substr(2,8).toUpperCase() + "\n\nYou will receive a confirmation email shortly.");
    }
  </script>
</body>
</html>

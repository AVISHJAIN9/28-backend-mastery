<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Soft Delete Demo</title>
  <style>
    body { font-family: sans-serif; background: #f7f7f7; margin: 0; padding: 0; }
    .container { max-width: 600px; margin: 40px auto; background: #fff; border-radius: 8px; box-shadow: 0 2px 8px #0001; padding: 32px; }
    h1 { color: #3b82f6; }
    input, button { padding: 10px; margin: 8px 0; width: 100%; border-radius: 4px; border: 1px solid #ddd; box-sizing: border-box; }
    .delete { background: #ef4444; color: #fff; border: none; }
    .restore { background: #10b981; color: #fff; border: none; }
    .result { background: #e0f7fa; padding: 12px; border-radius: 4px; margin-top: 16px; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Soft Delete Controller</h1>
    <input type="number" id="userId" placeholder="User ID" />
    <button class="delete" onclick="deleteRecord()">Soft Delete</button>
    <button class="restore" onclick="restoreRecord()">Restore Deleted</button>
    <div class="result" id="output"></div>
  </div>
  <script>
    function deleteRecord() {
      const id = document.getElementById('userId').value;
      fetch(`/api/users/${id}`, { method: 'DELETE' })
        .then(r => r.json()).then(d => document.getElementById('output').textContent = JSON.stringify(d))
        .catch(e => document.getElementById('output').textContent = e.message);
    }
    function restoreRecord() {
      const id = document.getElementById('userId').value;
      fetch(`/api/users/${id}/restore`, { method: 'POST' })
        .then(r => r.json()).then(d => document.getElementById('output').textContent = JSON.stringify(d))
        .catch(e => document.getElementById('output').textContent = e.message);
    }
  </script>
</body>
</html>

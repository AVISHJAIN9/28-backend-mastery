<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>OpenAPI Swagger Docs Demo</title>
	<style>
		body { font-family: sans-serif; background: #f7f7f7; margin: 0; padding: 0; }
		.container { max-width: 600px; margin: 40px auto; background: #fff; border-radius: 8px; box-shadow: 0 2px 8px #0001; padding: 32px; text-align: center; }
		h1 { color: #3b82f6; }
		a { display: inline-block; margin-top: 30px; padding: 14px 32px; background: #3b82f6; color: #fff; border-radius: 6px; text-decoration: none; font-size: 18px; font-weight: bold; }
		a:hover { background: #2563eb; }
	</style>
</head>
<body>
	<div class="container">
		<h1>OpenAPI / Swagger Docs</h1>
		<p>View the full API documentation and try endpoints interactively:</p>
		<a href="/api/docs" target="_blank">Open Swagger UI</a>
	</div>
</body>
</html>

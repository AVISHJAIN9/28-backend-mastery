<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>API Gateway Demo</title>
  <style>
    body { font-family: sans-serif; background: #f7f7f7; margin: 0; padding: 0; }
    .container { max-width: 600px; margin: 40px auto; background: #fff; border-radius: 8px; box-shadow: 0 2px 8px #0001; padding: 32px; }
    h1 { color: #3b82f6; }
    select, button { padding: 10px; margin: 8px 0; width: 100%; border-radius: 4px; border: 1px solid #ddd; box-sizing: border-box; }
    button { background: #3b82f6; color: #fff; border: none; cursor: pointer; }
    .result { background: #e0f7fa; padding: 12px; border-radius: 4px; margin-top: 16px; word-break: break-all; }
  </style>
</head>
<body>
  <div class="container">
    <h1>API Gateway Routing Demo</h1>
    <select id="service">
      <option value="service1">Service 1</option>
      <option value="service2">Service 2</option>
      <option value="service3">Service 3</option>
    </select>
    <button onclick="callService()">Call Service via Gateway</button>
    <div class="result" id="output"></div>
  </div>
  <script>
    function callService() {
      const service = document.getElementById('service').value;
      fetch(`/gateway/${service}/api/data`)
        .then(r => r.json())
        .then(d => document.getElementById('output').textContent = JSON.stringify(d))
        .catch(e => document.getElementById('output').textContent = 'Error: ' + e.message);
    }
  </script>
</body>
</html>

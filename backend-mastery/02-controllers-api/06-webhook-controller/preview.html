<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Webhook Controller Demo</title>
	<style>
		body { font-family: sans-serif; background: #f7f7f7; margin: 0; padding: 0; }
		.container { max-width: 600px; margin: 40px auto; background: #fff; border-radius: 8px; box-shadow: 0 2px 8px #0001; padding: 32px; }
		h1 { color: #3b82f6; }
		input, button { padding: 10px; margin: 8px 0; width: 100%; border-radius: 4px; border: 1px solid #ddd; }
		button { background: #3b82f6; color: #fff; border: none; cursor: pointer; }
		.result { background: #e0f7fa; padding: 12px; border-radius: 4px; margin-top: 16px; word-break: break-all; }
		.error { background: #ffebee; color: #c62828; padding: 12px; border-radius: 4px; margin-top: 16px; }
	</style>
</head>
<body>
	<div class="container">
		<h1>Webhook Registration</h1>
		<form id="webhookForm">
			<label>Webhook URL:</label>
			<input type="url" id="url" placeholder="https://yourapp.com/webhook" required />
			<label>Event Type:</label>
			<input type="text" id="event" placeholder="order.created" required />
			<button type="submit">Register Webhook</button>
		</form>
		<div id="output"></div>
	</div>
	<script>
		document.getElementById('webhookForm').onsubmit = async function(e) {
			e.preventDefault();
			const url = document.getElementById('url').value;
			const event = document.getElementById('event').value;
			const output = document.getElementById('output');
			output.innerHTML = '';
			try {
				const res = await fetch('/api/webhooks', {
					method: 'POST',
					headers: { 'Content-Type': 'application/json' },
					body: JSON.stringify({ url, event })
				});
				const data = await res.json();
				if (res.ok && data.id) {
					output.innerHTML = `<div class='result'><strong>Webhook Registered:</strong><br>ID: ${data.id}<br>URL: ${data.url}<br>Event: ${data.event}</div>`;
				} else {
					output.innerHTML = `<div class='error'>${data.error || 'Failed to register webhook.'}</div>`;
				}
			} catch (err) {
				output.innerHTML = `<div class='error'>${err.message}</div>`;
			}
		};
	</script>
</body>
</html>

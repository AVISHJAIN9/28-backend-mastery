<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Database Transactions Demo</title>
  <style>
    body { font-family: sans-serif; background: #f7f7f7; margin: 0; padding: 0; }
    .container { max-width: 600px; margin: 40px auto; background: #fff; border-radius: 8px; box-shadow: 0 2px 8px #0001; padding: 32px; }
    h1 { color: #3b82f6; }
    input, button { padding: 10px; margin: 8px 0; width: 100%; border-radius: 4px; border: 1px solid #ddd; box-sizing: border-box; }
    button { background: #3b82f6; color: #fff; border: none; cursor: pointer; }
    .result { background: #e0f7fa; padding: 12px; border-radius: 4px; margin-top: 16px; word-break: break-all; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Database Transaction Demo</h1>
    <input type="number" id="from" placeholder="From Account ID" />
    <input type="number" id="to" placeholder="To Account ID" />
    <input type="number" id="amount" placeholder="Transfer Amount" />
    <button onclick="transfer()">Execute Transfer</button>
    <div class="result" id="output"></div>
  </div>
  <script>
    function transfer() {
      const from = document.getElementById('from').value;
      const to = document.getElementById('to').value;
      const amount = document.getElementById('amount').value;
      
      fetch('/api/transfer', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ from, to, amount: parseFloat(amount) })
      }).then(r => r.json()).then(d => {
        document.getElementById('output').textContent = JSON.stringify(d);
      }).catch(e => document.getElementById('output').textContent = e.message);
    }
  </script>
</body>
</html>

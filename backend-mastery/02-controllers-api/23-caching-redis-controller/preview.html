<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Caching Controller Demo</title>
  <style>
    body { font-family: sans-serif; background: #f7f7f7; margin: 0; padding: 0; }
    .container { max-width: 600px; margin: 40px auto; background: #fff; border-radius: 8px; box-shadow: 0 2px 8px #0001; padding: 32px; }
    h1 { color: #3b82f6; }
    input, button { padding: 10px; margin: 8px 0; width: 100%; border-radius: 4px; border: 1px solid #ddd; box-sizing: border-box; }
    button { background: #3b82f6; color: #fff; border: none; cursor: pointer; }
    .result { background: #e0f7fa; padding: 12px; border-radius: 4px; margin-top: 16px; word-break: break-all; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Redis Caching Demo</h1>
    <form id="cacheForm">
      <label>Cache Key:</label>
      <input type="text" id="key" placeholder="my-key" required />
      <label>Cache Value:</label>
      <input type="text" id="value" placeholder="my-value" required />
      <button type="submit">Set Cache</button>
    </form>
    <div id="output"></div>
  </div>
</body>
</html>

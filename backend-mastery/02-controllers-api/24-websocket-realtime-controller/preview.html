<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WebSocket Controller Demo</title>
  <style>
    body { font-family: sans-serif; background: #f7f7f7; margin: 0; padding: 0; }
    .container { max-width: 600px; margin: 40px auto; background: #fff; border-radius: 8px; box-shadow: 0 2px 8px #0001; padding: 32px; }
    h1 { color: #3b82f6; }
    .status { padding: 10px; background: #e0f7fa; border-radius: 4px; margin: 10px 0; }
    input, button { padding: 10px; margin: 8px 0; width: 100%; border-radius: 4px; border: 1px solid #ddd; box-sizing: border-box; }
    button { background: #3b82f6; color: #fff; border: none; cursor: pointer; }
    .messages { background: #f5f5f5; padding: 12px; border-radius: 4px; margin-top: 16px; max-height: 300px; overflow-y: auto; }
  </style>
</head>
<body>
  <div class="container">
    <h1>WebSocket Real-time Demo</h1>
    <div class="status" id="status">🔴 Disconnected</div>
    <input type="text" id="message" placeholder="Your message" />
    <button onclick="sendMessage()">Send Message</button>
    <div class="messages" id="messages"></div>
  </div>
  <script>
    const ws = new WebSocket('ws://localhost:5024/socket');
    ws.onopen = () => document.getElementById('status').textContent = '🟢 Connected';
    ws.onmessage = (e) => {
      const div = document.createElement('div');
      div.style.padding = '8px';
      div.style.marginBottom = '4px';
      div.style.background = '#e0f7fa';
      div.style.borderRadius = '4px';
      div.textContent = e.data;
      document.getElementById('messages').appendChild(div);
    };
    ws.onclose = () => document.getElementById('status').textContent = '🔴 Disconnected';
    function sendMessage() {
      const input = document.getElementById('message');
      if (input.value) {
        ws.send(input.value);
        input.value = '';
      }
    }
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kafka Message Queue Demo</title>
  <style>
    body { font-family: sans-serif; background: #f7f7f7; margin: 0; padding: 0; }
    .container { max-width: 600px; margin: 40px auto; background: #fff; border-radius: 8px; box-shadow: 0 2px 8px #0001; padding: 32px; }
    h1 { color: #3b82f6; }
    input, button { padding: 10px; margin: 8px 0; width: 100%; border-radius: 4px; border: 1px solid #ddd; box-sizing: border-box; }
    button { background: #3b82f6; color: #fff; border: none; cursor: pointer; }
    .result { background: #e0f7fa; padding: 12px; border-radius: 4px; margin-top: 16px; word-break: break-all; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Kafka Message Queue Demo</h1>
    <input type="text" id="message" placeholder="Your message" />
    <button onclick="publishMessage()">Publish Message</button>
    <div class="result" id="output"></div>
  </div>
  <script>
    function publishMessage() {
      const input = document.getElementById('message');
      if (input.value) {
        fetch('/api/publish', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: input.value })
        }).then(r => r.json()).then(d => {
          document.getElementById('output').textContent = JSON.stringify(d);
          input.value = '';
        }).catch(e => document.getElementById('output').textContent = e.message);
      }
    }
  </script>
</body>
</html>

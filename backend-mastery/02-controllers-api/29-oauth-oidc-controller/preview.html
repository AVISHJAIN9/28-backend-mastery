<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OAuth/OIDC Demo</title>
  <style>
    body { font-family: sans-serif; background: #f7f7f7; margin: 0; padding: 0; }
    .container { max-width: 600px; margin: 40px auto; background: #fff; border-radius: 8px; box-shadow: 0 2px 8px #0001; padding: 32px; }
    h1 { color: #3b82f6; }
    button { padding: 10px; margin: 8px 0; width: 100%; border-radius: 4px; border: none; color: #fff; cursor: pointer; }
    .login { background: #3b82f6; }
    .logout { background: #ef4444; }
    .info { background: #e0f7fa; padding: 12px; border-radius: 4px; margin-top: 16px; }
  </style>
</head>
<body>
  <div class="container">
    <h1>OAuth/OIDC Authentication Demo</h1>
    <button class="login" onclick="window.location.href='/auth/login'">Login with OAuth Provider</button>
    <div id="userInfo"></div>
  </div>
  <script>
    // Check if user is logged in
    fetch('/api/user')
      .then(r => r.json())
      .then(d => {
        if (d.user) {
          document.getElementById('userInfo').innerHTML = `
            <div class="info">
              <p>Connected as: <strong>${d.user.email}</strong></p>
              <button class="logout" onclick="fetch('/auth/logout').then(() => location.reload())">Logout</button>
            </div>
          `;
        }
      }).catch(() => {});
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Health Monitoring Demo</title>
  <style>
    body { font-family: sans-serif; background: #f7f7f7; margin: 0; padding: 0; }
    .container { max-width: 600px; margin: 40px auto; background: #fff; border-radius: 8px; box-shadow: 0 2px 8px #0001; padding: 32px; }
    h1 { color: #3b82f6; }
    button { padding: 10px; margin: 8px 0; width: 100%; border-radius: 4px; border: none; color: #fff; cursor: pointer; }
    .primary { background: #3b82f6; }
    .secondary { background: #8b5cf6; }
    .result { background: #e0f7fa; padding: 12px; border-radius: 4px; margin-top: 16px; word-break: break-all; max-height: 300px; overflow-y: auto; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Health & Monitoring Dashboard</h1>
    <button class="primary" onclick="checkHealth()">Check Liveness</button>
    <button class="secondary" onclick="checkReadiness()">Check Readiness</button>
    <button class="primary" onclick="getMetrics()">View Metrics</button>
    <div class="result" id="output"></div>
  </div>
  <script>
    function checkHealth() {
      fetch('/health/live')
        .then(r => r.json())
        .then(d => document.getElementById('output').textContent = 'Liveness: ' + JSON.stringify(d))
        .catch(e => document.getElementById('output').textContent = 'Error: ' + e.message);
    }
    function checkReadiness() {
      fetch('/health/ready')
        .then(r => r.json())
        .then(d => document.getElementById('output').textContent = 'Readiness: ' + JSON.stringify(d))
        .catch(e => document.getElementById('output').textContent = 'Error: ' + e.message);
    }
    function getMetrics() {
      fetch('/metrics')
        .then(r => r.text())
        .then(d => document.getElementById('output').textContent = d.substring(0, 1000))
        .catch(e => document.getElementById('output').textContent = 'Error: ' + e.message);
    }
  </script>
</body>
</html>

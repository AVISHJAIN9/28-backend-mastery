<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Admin Panel Controller Demo</title>
	<style>
		body { font-family: sans-serif; background: #f7f7f7; margin: 0; padding: 0; }
		.container { max-width: 700px; margin: 40px auto; background: #fff; border-radius: 8px; box-shadow: 0 2px 8px #0001; padding: 32px; }
		h1 { color: #3b82f6; }
		input, button, select { padding: 10px; margin: 8px 0; width: 100%; border-radius: 4px; border: 1px solid #ddd; }
		button { background: #3b82f6; color: #fff; border: none; cursor: pointer; }
		.result { background: #e0f7fa; padding: 12px; border-radius: 4px; margin-top: 16px; word-break: break-all; }
		.error { background: #ffebee; color: #c62828; padding: 12px; border-radius: 4px; margin-top: 16px; }
		.row { display: flex; gap: 10px; }
		.row > * { flex: 1; }
	</style>
</head>
<body>
	<div class="container">
		<h1>Admin Panel Demo</h1>
		<form id="userForm">
			<label>User Email:</label>
			<input type="email" id="email" placeholder="user@example.com" required />
			<label>Role:</label>
			<select id="role">
				<option value="admin">Admin</option>
				<option value="moderator">Moderator</option>
				<option value="user">User</option>
			</select>
			<button type="submit">Create User</button>
		</form>
		<div id="output"></div>
	</div>
	<script>
		document.getElementById('userForm').onsubmit = async function(e) {
			e.preventDefault();
			const email = document.getElementById('email').value;
			const role = document.getElementById('role').value;
			const output = document.getElementById('output');
			output.innerHTML = '';
			try {
				const res = await fetch('/api/admin/users', {
					method: 'POST',
					headers: { 'Content-Type': 'application/json' },
					body: JSON.stringify({ email, role })
				});
				const data = await res.json();
				if (res.ok && data.id) {
					output.innerHTML = `<div class='result'><strong>User Created:</strong><br>ID: ${data.id}<br>Email: ${data.email}<br>Role: ${data.role}</div>`;
				} else {
					output.innerHTML = `<div class='error'>${data.error || 'Failed to create user.'}</div>`;
				}
			} catch (err) {
				output.innerHTML = `<div class='error'>${err.message}</div>`;
			}
		};
	</script>
</body>
</html>

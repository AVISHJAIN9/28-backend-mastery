<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Batch Processing Demo</title>
  <style>
    body { font-family: sans-serif; background: #f7f7f7; margin: 0; padding: 0; }
    .container { max-width: 600px; margin: 40px auto; background: #fff; border-radius: 8px; box-shadow: 0 2px 8px #0001; padding: 32px; }
    h1 { color: #3b82f6; }
    select, button { padding: 10px; margin: 8px 0; width: 100%; border-radius: 4px; border: 1px solid #ddd; box-sizing: border-box; }
    button { background: #3b82f6; color: #fff; border: none; cursor: pointer; }
    .result { background: #e0f7fa; padding: 12px; border-radius: 4px; margin-top: 16px; word-break: break-all; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Batch Job Processing</h1>
    <select id="jobType">
      <option value="export">Export Data</option>
      <option value="import">Import Data</option>
      <option value="report">Generate Report</option>
    </select>
    <button onclick="submitJob()">Submit Batch Job</button>
    <button onclick="checkStatus()">Check Job Status</button>
    <div class="result" id="output"></div>
  </div>
  <script>
    let currentJobId = null;
    function submitJob() {
      const jobType = document.getElementById('jobType').value;
      fetch('/api/jobs', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ type: jobType })
      }).then(r => r.json()).then(d => {
        currentJobId = d.id;
        document.getElementById('output').textContent = 'Job submitted: ' + JSON.stringify(d);
      }).catch(e => document.getElementById('output').textContent = e.message);
    }
    function checkStatus() {
      if (!currentJobId) return;
      fetch(`/api/jobs/${currentJobId}`)
        .then(r => r.json()).then(d => document.getElementById('output').textContent = 'Status: ' + JSON.stringify(d))
        .catch(e => document.getElementById('output').textContent = e.message);
    }
  </script>
</body>
</html>

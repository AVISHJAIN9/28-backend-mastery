<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Analytics Controller Demo</title>
	<style>
		body { font-family: sans-serif; background: #f7f7f7; margin: 0; padding: 0; }
		.container { max-width: 700px; margin: 40px auto; background: #fff; border-radius: 8px; box-shadow: 0 2px 8px #0001; padding: 32px; }
		h1 { color: #3b82f6; }
		.row { display: flex; gap: 20px; margin-bottom: 20px; }
		.card { background: #e0f7fa; padding: 20px; border-radius: 8px; flex: 1; text-align: center; }
		.error { background: #ffebee; color: #c62828; padding: 12px; border-radius: 4px; margin-top: 16px; }
		button { padding: 10px 20px; background: #3b82f6; color: #fff; border: none; border-radius: 4px; cursor: pointer; margin-bottom: 20px; }
	</style>
</head>
<body>
	<div class="container">
		<h1>Analytics Dashboard</h1>
		<button onclick="fetchStats()">Refresh Stats</button>
		<div class="row">
			<div class="card" id="users">Users: <span>--</span></div>
			<div class="card" id="active">Active: <span>--</span></div>
			<div class="card" id="events">Events: <span>--</span></div>
		</div>
		<div id="error"></div>
	</div>
	<script>
		async function fetchStats() {
			document.getElementById('error').innerHTML = '';
			try {
				const res = await fetch('/api/analytics/stats');
				const data = await res.json();
				if (res.ok) {
					document.querySelector('#users span').textContent = data.users || 0;
					document.querySelector('#active span').textContent = data.active || 0;
					document.querySelector('#events span').textContent = data.events || 0;
				} else {
					document.getElementById('error').innerHTML = `<div class='error'>${data.error || 'Failed to fetch stats.'}</div>`;
				}
			} catch (err) {
				document.getElementById('error').innerHTML = `<div class='error'>${err.message}</div>`;
			}
		}
		fetchStats();
	</script>
</body>
</html>
